<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SentinelAI Audit Dashboard</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #fff;
            --text: #1b1f24;
            --muted: #5d6672;
            --line: #e1e5ea;
            --ok: #117a3d;
            --okbg: #e4f6ea;
            --bad: #b42318;
            --badbg: #fde8e6;
            --warn: #b54708;
            --warnbg: #fff1e0;
            --accent: #2457d6
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #14171b;
                --card: #1d2127;
                --text: #e8eaed;
                --muted: #9aa4b0;
                --line: #2d333b;
                --ok: #5fd68a;
                --okbg: #14301f;
                --bad: #ff8a80;
                --badbg: #3a1a17;
                --warn: #ffb866;
                --warnbg: #3a2a12;
                --accent: #7aa2ff
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 system-ui,Segoe UI,Arial,sans-serif
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 16px 48px
        }

        h1 {
            font-size: 22px;
            margin: 0 0 4px
        }

        .sub {
            color: var(--muted);
            margin: 0 0 20px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        input {
            flex: 1;
            min-width: 220px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font: inherit
        }

        button {
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            cursor: pointer
        }

            button.secondary {
                background: transparent;
                color: var(--accent);
                border: 1px solid var(--accent)
            }

        #banner {
            display: none;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-weight: 600
        }

            #banner small {
                display: block;
                font-weight: 400;
                margin-top: 2px
            }

            #banner.ok {
                display: block;
                background: var(--okbg);
                color: var(--ok)
            }

            #banner.bad {
                display: block;
                background: var(--badbg);
                color: var(--bad)
            }

        #msg {
            color: var(--bad);
            margin-top: 8px;
            min-height: 1.2em
        }

        .tablewrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap
        }

        th {
            color: var(--muted);
            font-weight: 600
        }

        td.payload {
            white-space: normal;
            word-break: break-all;
            color: var(--muted);
            font-family: Consolas,monospace;
            font-size: 12px;
            min-width: 220px
        }

        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600
        }

            .pill.high {
                background: var(--badbg);
                color: var(--bad)
            }

            .pill.mid {
                background: var(--warnbg);
                color: var(--warn)
            }

            .pill.low {
                background: var(--okbg);
                color: var(--ok)
            }

        .empty {
            color: var(--muted);
            padding: 12px 4px
        }
    </style>
</head>
<body>
    <main>
        <h1>SentinelAI Audit Dashboard</h1>
        <p class="sub">Tamper-evident log of every analyzed message.</p>

        <div class="card">
            <div class="row">
                <input id="key" type="password" placeholder="Paste your audit API key" autocomplete="off">
                <button id="connect">Connect</button>
                <button id="refresh" class="secondary">Refresh</button>
            </div>
            <div id="msg"></div>
        </div>

        <div id="banner"></div>

        <div class="card">
            <strong>Recent events</strong>
            <div class="tablewrap">
                <table>
                    <thead><tr><th>ID</th><th>Time (UTC)</th><th>Agent</th><th>Event</th><th>Risk</th><th>Payload</th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div id="empty" class="empty" style="display:none">No events yet.</div>
        </div>
    </main>

    <script>
  const keyInput = document.getElementById('key');
  const msg = document.getElementById('msg');
  const banner = document.getElementById('banner');
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');

  // The key lives only in this browser tab and is cleared when the tab closes.
  keyInput.value = sessionStorage.getItem('auditKey') || '';

  async function api(path) {
    const r = await fetch(path, { headers: { 'X-Api-Key': keyInput.value.trim() } });
    if (r.status === 401) throw new Error('Wrong or missing API key.');
    if (r.status === 503) throw new Error('The server has no audit key configured.');
    if (!r.ok) throw new Error('Server error (' + r.status + ').');
    return r.json();
  }

  function renderChain(v) {
    banner.className = v.valid ? 'ok' : 'bad';
    banner.textContent = '';
    const title = document.createElement('div');
    title.textContent = v.valid
      ? 'Chain intact: ' + v.entriesChecked + ' entries verified'
      : 'CHAIN BROKEN at entry ' + v.firstBrokenEntryId;
    banner.appendChild(title);
    if (!v.valid && v.reason) {
      const small = document.createElement('small');
      small.textContent = v.reason;
      banner.appendChild(small);
    }
  }

  function cell(text, cls) {
    const td = document.createElement('td');
    td.textContent = text;
    if (cls) td.className = cls;
    return td;
  }

  function renderRows(list) {
    rowsEl.textContent = '';
    emptyEl.style.display = list.length ? 'none' : 'block';
    for (const e of list) {
      const tr = document.createElement('tr');
      tr.appendChild(cell(e.id));
      tr.appendChild(cell(new Date(e.timestampUtc).toISOString().replace('T', ' ').slice(0, 19)));
      tr.appendChild(cell(e.agentId));
      tr.appendChild(cell(e.eventType));
      const risk = document.createElement('td');
      const pill = document.createElement('span');
      pill.className = 'pill ' + (e.riskScore >= 80 ? 'high' : e.riskScore >= 50 ? 'mid' : 'low');
      pill.textContent = e.riskScore;
      risk.appendChild(pill);
      tr.appendChild(risk);
      tr.appendChild(cell(e.payload, 'payload'));
      rowsEl.appendChild(tr);
    }
  }

  async function load() {
    msg.textContent = '';
    sessionStorage.setItem('auditKey', keyInput.value.trim());
    try {
      const [verify, recent] = await Promise.all([api('/api/audit/verify'), api('/api/audit/recent')]);
      renderChain(verify);
      renderRows(recent);
    } catch (err) {
      banner.className = '';
      rowsEl.textContent = '';
      msg.textContent = err.message;
    }
  }

  document.getElementById('connect').addEventListener('click', load);
  document.getElementById('refresh').addEventListener('click', load);
  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  if (keyInput.value) load();
    </script>
</body>
</html>
